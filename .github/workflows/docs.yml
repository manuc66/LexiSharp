name: docs

# Publishes the Jekyll site and the Blazor WebAssembly proof under /wasm/.
# Requires Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "samples/LexiSharp.WasmDemo/**"
      - "src/LexiSharp/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6

      - name: Publish the WASM proof
        run: >
          dotnet publish samples/LexiSharp.WasmDemo/LexiSharp.WasmDemo.csproj
          -c Release
          -o "${{ runner.temp }}/wasm"

      - name: Build the Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Add the WASM proof to the site
        run: |
          # jekyll-build-pages runs Jekyll in a container, so _site comes back
          # owned by root and the runner cannot create anything under it.
          sudo chown -R "$(id -u):$(id -g)" _site

          # /wasm/ belongs to the app; the page that embeds it lives at
          # /wasm-demo/ (permalink in docs/wasm.md). If Jekyll ever writes
          # _site/wasm again, the two would silently overwrite each other.
          if [ -e _site/wasm ]; then
            echo "::error::_site/wasm already exists: the docs page and the WASM app are colliding"
            exit 1
          fi

          mkdir -p _site/wasm
          cp -r "${{ runner.temp }}/wasm/wwwroot/." _site/wasm/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v5
