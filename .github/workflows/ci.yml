name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# Only cancel in-progress runs for PRs; main pushes must always run
# (their results gate the NuGet publish on tagged commits).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  preflight:
    # secrets are not usable in job-level `if:` conditions, so a first job
    # detects which optional services are configured and exposes booleans.
    runs-on: ubuntu-latest
    outputs:
      has_sonar: ${{ steps.check.outputs.has_sonar }}
    steps:
      - id: check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "has_sonar=$([ -n "$SONAR_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  core:
    name: Build + unit tests + coverage (no backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      # coverlet.msbuild instruments during the build, so coverage collection
      # requires the build to happen inside the same dotnet test invocation
      # (--no-build would skip instrumentation and empty the report).
      #
      # The two console tools under bench/ (LexiSharp.CodeShape, LexiSharp.ApiDocs) are build
      # tooling, excluded for the same reason the SonarCloud step below already excludes bench/:
      # the 60% line gate is about the library, and a console front end is not library code.
      # Measured rather than assumed, on this commit: excluding both gives 81.80%; counting
      # ApiDocs (75.67% of its own lines - the reader is tested, its Program.cs is not) gives
      # 81.46%; counting both also gives 80.67%, CodeShape sitting at 41.97%.
      #
      # Two spellings matter here, and both were found by running them rather than by reading
      # about them. ExcludeFromCodeCoverage on the ProjectReference is not honoured by
      # coverlet.msbuild, which is why the filter is spelled out in the command. And the list is
      # comma-separated with the comma written %2c: MSBuild reads a literal semicolon in a -p:
      # value as a property separator and rejects the switch outright, while a bare comma makes
      # it through this shell but is one quoting change away from failing the step.
      - name: Test with coverage (60% total line gate)
        run: >
          dotnet test tests/LexiSharp.Tests -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=../../TestResults/coverage-
          -p:Threshold=60 -p:ThresholdType=line -p:ThresholdStat=total
          -p:Exclude="[LexiSharp.CodeShape]*%2c[LexiSharp.ApiDocs]*"

      # The behavioural gate. The xUnit suite pins contracts - BM25 ranks X above Y on a
      # three-document corpus - but nothing pinned the *output* of a realistic run, so a
      # refactor of the tie-break in InsertRanked across 200 documents would have stayed green.
      # `verify` replays the reference corpus against a committed baseline and is fully
      # deterministic, which is why it can gate a build when a benchmark cannot: no clock is
      # involved, so there is nothing to be noisy. Re-record with `lexisharp baseline` and read
      # the diff - never accept one to make the build pass.
      #
      # The config set is itself load-bearing. Each entry pushes a scorer's *default* parameters
      # through a real ranking, so changing a public default surfaces as a reviewable diff instead of
      # as somebody else's search results. `bm25f`, `bm25+`, `bm25l` and `bm25-proximity-full` are
      # here for that reason: an audit of the suite found those four defaults were pinned by nothing
      # at all. What that still cannot catch is recorded in the reference corpus README.
      - name: Golden master (ranking outputs must not drift)
        run: >
          dotnet run --project bench/LexiSharp.Cli -c Release --
          verify bench/reference-corpus/corpus
          --queries bench/reference-corpus/queries.json
          --qrels   bench/reference-corpus/qrels.tsv
          --configs bm25,bm25-semantic,bm25f,bm25+,bm25l,bm25-proximity-full --top-k 5
          --against bench/reference-corpus/golden/rankings.txt

      # The publish workflow pushes .snupkg symbol packages, which are produced by
      # Directory.Build.props rather than by an explicit flag on the csproj files. A
      # setting that silently stops applying would not fail the build: `dotnet pack`
      # would just emit one fewer file. So pack here and check what actually landed:
      # every managed DLL in the nupkg has a PDB in the snupkg, and no PDB leaked into
      # the nupkg (a PDB inside the nupkg is not a symbol package - nuget.org's symbol
      # server would never be asked for it, and consumers would not get it either).
      - name: Symbol packages
        run: |
          dotnet pack src/LexiSharp/LexiSharp.csproj -c Release -o "$RUNNER_TEMP/nupkgs"
          python3 - "$RUNNER_TEMP/nupkgs" <<'PY'
          import glob, os, sys, zipfile

          out = sys.argv[1]
          nupkgs = glob.glob(os.path.join(out, "*.nupkg"))
          snupkgs = glob.glob(os.path.join(out, "*.snupkg"))
          if len(nupkgs) != 1 or len(snupkgs) != 1:
              sys.exit(f"expected exactly one .nupkg and one .snupkg, got {nupkgs} {snupkgs}")

          nupkg, snupkg = zipfile.ZipFile(nupkgs[0]), zipfile.ZipFile(snupkgs[0])
          pdbs = {e for e in snupkg.namelist() if e.endswith(".pdb")}
          if not pdbs:
              sys.exit("the .snupkg carries no PDB")
          if any(e.endswith(".pdb") for e in nupkg.namelist()):
              sys.exit("a PDB was packed into the .nupkg instead of the .snupkg")

          # One PDB per assembly, matched on the entry path: the symbol server looks a
          # symbol package up by the DLL's own path inside the package, so lib/net10.0/X.dll
          # is served from lib/net10.0/X.pdb and nothing else counts.
          missing = [
              e for e in nupkg.namelist()
              if e.startswith("lib/") and e.endswith(".dll") and e[:-len(".dll")] + ".pdb" not in pdbs
          ]
          if missing:
              sys.exit(f"no PDB in the .snupkg for: {missing}")
          print(f"OK: {len(pdbs)} PDB(s) in {os.path.basename(snupkgs[0])}")
          PY

      - name: Code shape manifests
        # The structural shape of every shipped assembly: per method, the length of its IL and its
        # decoded local signature, with no metadata token anywhere. Publishing it as an artifact is
        # what makes a later "did the generated code move" answerable without rebuilding two commits
        # on one machine: download the manifests from two runs and diff them.
        #
        # Advisory, and it gates nothing. Adding a method or a type legitimately changes a
        # manifest, so failing on a difference would fail every ordinary source edit. The entries
        # worth failing on are the ones a reader counts as a cost change - a method present in both
        # runs with a different size or a different local signature - and those are what
        # `cod-shape compare` reports, on two manifests, when you go looking.
        #
        # Read a size difference across two runs as a question, not a finding: the manifest
        # measures what the compiler emitted, and the first run of this step reported 135,181 IL
        # bytes for LexiSharp.dll where a local build of the same commit gave 135,373, with
        # identical method counts. Same source, SDK 10.0.401 against 10.0.111 - which is what
        # moved it, and what global.json now pins so a manifest and a local build agree.
        run: |
          mkdir -p "$RUNNER_TEMP/cod-shape"

          # Built here rather than inherited from the test step: this step reads assemblies out of
          # bin/, and depending on an earlier step having built them is how a manifest ends up
          # describing yesterday's code without anything failing.
          dotnet build LexiSharp.slnx -c Release

          for project in LexiSharp LexiSharp.AspNetCore LexiSharp.MessagePack LexiSharp.Postgres; do
            assembly="src/$project/bin/Release/net10.0/$project.dll"
            test -f "$assembly" || { echo "missing $assembly"; exit 1; }
            dotnet run --project bench/LexiSharp.CodeShape -c Release --no-build -- emit \
              "$assembly" "$RUNNER_TEMP/cod-shape/$project.shape.txt"
          done
          wc -l "$RUNNER_TEMP/cod-shape/"*.txt

      - name: API reference is in sync
        # docs/api.md is generated from the compiled assemblies and the XML documentation they
        # ship, so the page cannot describe a public surface that does not exist. This step is
        # what makes that a property of the build rather than a habit: a new public type with no
        # regenerated page fails here, while adding the type is still cheap to document.
        #
        # It reads the Release assemblies the step above produced, so it asserts they are there
        # rather than trusting a previous step to have built them.
        run: |
          for project in LexiSharp LexiSharp.AspNetCore LexiSharp.MessagePack LexiSharp.Postgres; do
            test -f "src/$project/bin/Release/net10.0/$project.dll" || { echo "missing build of $project"; exit 1; }
          done

          dotnet run --project bench/LexiSharp.ApiDocs -c Release --no-build -- check

      - name: Upload code shape manifests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: code-shape
          path: ${{ runner.temp }}/cod-shape/
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage to Codecov
        # Auto-skipped until CODECOV_TOKEN is configured on the repository.
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          files: TestResults/**/coverage*.cobertura.xml
          fail_ci_if_error: true

  postgres:
    name: Integration tests (pgvector/pgvector:pg16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: postgres  # NOSONAR:S2068 (local test container only; Sonar flags the dummy dev password)
          POSTGRES_DB: lexisharp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=lexisharp  # NOSONAR:S2068 (dummy password for ephemeral CI container)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      - name: Build
        run: dotnet build LexiSharp.slnx -c Release

      - name: Test (lexical + vector + sparse + fuzzy)
        run: dotnet test tests/LexiSharp.Tests -c Release --no-build

  paradedb:
    name: Integration tests (paradedb/paradedb:pg16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:pg16@sha256:ac8ad72f57da6fa35738d346b9970811a4ab9ce0ba7f183bea27e0ad7b037222
        env:
          POSTGRES_PASSWORD: postgres  # NOSONAR:S2068 (local test container only; Sonar flags the dummy dev password)
          POSTGRES_DB: lexisharp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=lexisharp  # NOSONAR:S2068 (dummy password for ephemeral CI container)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      - name: Build
        run: dotnet build LexiSharp.slnx -c Release

      - name: Test (lexical + ParadeDB BM25 + fuzzy)
        run: dotnet test tests/LexiSharp.Tests -c Release --no-build

  aot:
    # Publish a real consumer with ILC, then run it. The IsAotCompatible analyzers catch most
    # problems at build time, but a resolver that reaches for reflection only on first use passes
    # them — so the binary must actually index, search, and read a document back from Postgres.
    name: Native AOT smoke (publish + run)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: postgres  # NOSONAR:S2068 (local test container only; Sonar flags the dummy dev password)
          POSTGRES_DB: lexisharp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_CONNECTION: Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=lexisharp  # NOSONAR:S2068 (dummy password for ephemeral CI container)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      - name: Native toolchain for ILC
        # clang and the zlib headers the native link needs. Installed rather than assumed
        # from whatever the runner image happens to carry: an image change would otherwise
        # surface here first, as an opaque linker failure in one job.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish (ILC over the closure; a warning fails the build)
        run: dotnet publish tests/LexiSharp.AotSmoke -c Release -r linux-x64 -o "$RUNNER_TEMP/aot-smoke"

      - name: Run the smoke
        run: "$RUNNER_TEMP/aot-smoke/LexiSharp.AotSmoke"

  analysis:
    # SonarCloud cannot be analyzed with the generic GitHub action; C# requires
    # the SonarScanner for .NET, and per Sonar's docs the coverage report must
    # be produced in the same job (between begin and end), so this job builds
    # and tests the solution itself. Auto-skipped until SONAR_TOKEN is set.
    # Coverage excludes LexiSharp.Postgres (including its ParadeDB/pg_search
    # engine): their integration tests auto-skip without POSTGRES_TEST_CONNECTION,
    # so counting them would drag the new-code coverage gate under 80% on every
    # Postgres change.
    name: SonarCloud analysis
    needs: preflight
    if: needs.preflight.outputs.has_sonar == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner --version 11.2.1

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_KEY: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          pr_args=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr_args="/d:sonar.pullrequest.key=$PR_KEY /d:sonar.pullrequest.branch=$PR_BRANCH /d:sonar.pullrequest.base=$PR_BASE"
          fi
          dotnet-sonarscanner begin /k:manuc66_lexisharp /o:manuc66-github /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url=https://sonarcloud.io /d:sonar.cs.cobertura.reportsPaths=TestResults/**/coverage*.cobertura.xml /d:sonar.exclusions=**/*Tests*/**/*,**/bench/**/* /d:sonar.coverage.exclusions=**/LexiSharp.Postgres/**/* $pr_args

      - name: Test with coverage
        # The build happens here: coverlet.msbuild instrumentation requires
        # build and test in the same invocation.
        #
        # The same LexiSharp.CodeShape exclusion as the core job, so the two cobertura reports
        # stay comparable. It gates nothing here, but a report that differs from the core job's
        # for a reason that has nothing to do with the code is a measurement artefact waiting to
        # be mistaken for one.
        run: >
          dotnet test tests/LexiSharp.Tests -c Release
          -p:CollectCoverage=true -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=../../TestResults/coverage-
          -p:Exclude="[LexiSharp.CodeShape]*"

      - name: End SonarCloud analysis
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license-check:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify LICENSE file and package license declarations
        run: |
          test -f LICENSE || { echo "ERROR: LICENSE file missing"; exit 1; }
          grep -q "MIT License" LICENSE || { echo "ERROR: LICENSE is not MIT"; exit 1; }
          for csproj in src/*/*.csproj; do
            if grep -q '<IsPackable>true</IsPackable>' "$csproj"; then
              grep -q '<PackageLicenseExpression>MIT</PackageLicenseExpression>' "$csproj" \
                || { echo "ERROR: $csproj does not declare the MIT license"; exit 1; }
              echo "OK: $csproj (MIT)"
            fi
          done

  sbom:
    name: SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: ./
          artifact-name: sbom.spdx.json
          format: spdx-json

  bench-smoke:
    # Does not measure performance: only proves the benchmarks build and run
    # end-to-end (regressions in the bench harness fail CI just like tests).
    name: Benchmarks smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      - name: Run one benchmark class (short job)
        run: >
          dotnet run --project bench/LexiSharp.Benchmarks -c Release --
          --filter '*TokenizerBenchmarks*' --job short

  # The SearchTrace allocation re-measurement used to live here, on every push. It is now
  # workflow_dispatch in search-allocation.yml: nothing read its artifact, so ~9 runner-hours a week
  # restated numbers that had not moved. Dispatch it when the index or the scoring path changes.
