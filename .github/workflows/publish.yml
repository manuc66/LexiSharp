name: Publish NuGet

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag can be pushed with a failing build (branch protection does not
      # cover tags), so gate publishing on the tagged commit's CI checks.
      - name: Fail if CI checks did not pass on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checks=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs --jq '.check_runs')
          echo "$checks" | jq -e 'length > 0' > /dev/null || { echo "No CI check runs found for ${{ github.sha }}"; exit 1; }
          echo "$checks" | jq -e 'all(.[]; .status == "completed" and .conclusion == "success")' > /dev/null \
            || { echo "CI checks not all green for ${{ github.sha }}:"; echo "$checks" | jq -r '.[] | "\(.name): \(.status)/\(.conclusion)"'; exit 1; }
          echo "All CI checks passed for ${{ github.sha }}"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Compute version from the tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack LexiSharp
        run: dotnet pack src/LexiSharp/LexiSharp.csproj -c Release -o nupkgs /p:Version=${{ steps.ver.outputs.version }}

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet API key (no long-lived secret). Requires a trusted publishing
      # policy on nuget.org for owner manuc66, repository lexisharp and
      # workflow .github/workflows/publish.yml.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: manuc66

      # No snupkg is produced (no symbol package configured), so plain
      # --skip-duplicate is safe here: it never re-pushes a symbol package
      # whose PDBs would not match the already-published DLLs.
      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        if: ${{ !contains(steps.ver.outputs.version, '-') }}
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          files: nupkgs/*.nupkg
          generate_release_notes: true
