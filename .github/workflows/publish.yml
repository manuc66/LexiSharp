name: Publish NuGet

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # A tag can be pushed with a failing build (branch protection does not
      # cover tags), so gate publishing on the tagged commit's CI checks.
      - name: Fail if CI checks did not pass on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only the latest check run per job is considered: retried jobs keep
          # their older failed/skipped runs, which must not block the release.
          checks=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" --jq '.check_runs')
          echo "$checks" | jq -e 'length > 0' > /dev/null || { echo "No CI check runs found for ${{ github.sha }}"; exit 1; }
          # "skipped" is accepted: optional jobs (Sonar, Codecov) are skipped
          # while their secrets are not configured and must not block releases.
          # The publish job itself is excluded: its own in-progress check run
          # is registered on the tagged commit before this gate executes.
          echo "$checks" | jq -e 'group_by(.name) | map(max_by(.id)) | map(select(.name != "publish")) | all(.[]; .status == "completed" and (.conclusion == "success" or .conclusion == "skipped"))' > /dev/null \
            || { echo "CI checks not all green for ${{ github.sha }}:"; echo "$checks" | jq -r '.[] | "\(.name): \(.status)/\(.conclusion)"'; exit 1; }
          echo "All CI checks passed for ${{ github.sha }}"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      - name: Compute version from the tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack LexiSharp
        run: dotnet pack src/LexiSharp/LexiSharp.csproj -c Release -o nupkgs /p:Version=${{ steps.ver.outputs.version }}

      - name: Pack LexiSharp.MessagePack
        run: dotnet pack src/LexiSharp.MessagePack/LexiSharp.MessagePack.csproj -c Release -o nupkgs /p:Version=${{ steps.ver.outputs.version }}

      - name: Pack LexiSharp.AspNetCore
        run: dotnet pack src/LexiSharp.AspNetCore/LexiSharp.AspNetCore.csproj -c Release -o nupkgs /p:Version=${{ steps.ver.outputs.version }}

      - name: Pack LexiSharp.Postgres
        run: dotnet pack src/LexiSharp.Postgres/LexiSharp.Postgres.csproj -c Release -o nupkgs /p:Version=${{ steps.ver.outputs.version }}

      # Trusted publishing: exchange the GitHub OIDC token for a short-lived
      # NuGet API key (no long-lived secret). Requires a trusted publishing
      # policy on nuget.org for owner manuc66, repository lexisharp and
      # workflow .github/workflows/publish.yml.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        id: nuget-login
        with:
          user: manuc66

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      # Symbol packages (.snupkg, one per project, produced by the IncludeSymbols /
      # SymbolPackageFormat settings in Directory.Build.props). nuget.org's symbol server
      # takes them from the same endpoint, but not from a .nupkg push: the packages have
      # to be pushed separately, and this is a separate step so that a symbol failure does
      # not hide behind an already-green package push.
      #
      # nuget.org does not let a published version be overwritten, so a re-run of this
      # workflow finds the symbols already there and --skip-duplicate makes the push a
      # no-op instead of a 409. That is also why the PDBs can never drift from the DLLs
      # they describe: a different build of the same version number cannot overwrite the
      # symbols either. Not verified against nuget.org, only reasoned from the documented
      # no-overwrite rule - the first tagged run is the real test.
      - name: Publish symbol packages to nuget.org
        run: >
          dotnet nuget push "nupkgs/*.snupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      # The symbol packages ride along with the release: nuget.org serves them, but only
      # to a debugger that asks the symbol server. Attaching them makes a stack trace
      # resolvable without that round trip.
      - name: Create GitHub release
        if: ${{ !contains(steps.ver.outputs.version, '-') }}
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e
        with:
          files: |
            nupkgs/*.nupkg
            nupkgs/*.snupkg
          generate_release_notes: true
