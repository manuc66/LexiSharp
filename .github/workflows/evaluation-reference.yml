name: Pinned reference

# Replays every pinned configuration in bench/LexiSharp.Eval/reference/pinned.json and fails if a
# value drifted. It exists because three documents promise this net and it was not attached to
# anything: README says "a change that moved them fails the build rather than the docs", and
# docs/index.md says "every number here is pinned and re-checked by --verify-reference". Until this
# workflow, no job in ci.yml ran --verify-reference at all, so the pins were re-checked when a human
# remembered to type the command. That is not a net, and the gap had a visible cost: a public
# constructor parameter, QueryTermWeighting, was inert on the main search path for a whole release
# and nothing noticed. Pinning it was half the fix and was not done in that commit, so the
# two arguana query-frequency pins below arrived later; they close the other half.
#
# On the effect's size, because it is quoted at two k1 and both are right: +0.042 at
# k1=1.5, b=0.75 (0.285 to 0.327) and +0.052 at the reference's own k1=0.9, b=0.4 (0.219 to
# 0.271). ArguAna's sensitivity to k1 runs opposite to the other two corpora, so the effect
# scales with it and a bare "+0.05" would be wrong at one of those points.
#
# Scoped rather than on every push, and the difference from the CI matrix is the corpora: they
# are not in the repository (.gitignore excludes bench/LexiSharp.Eval/data/) and are downloaded and
# md5-verified per run, so a per-push job would pay a ~100 MB download to re-answer a question that
# a documentation commit cannot have changed. The push trigger below is scoped to the paths that can
# move a score, so it fires on the commits where the answer is worth having.
#
# What is deliberately not here: the allocation job's reasoning for staying off every push was that
# nothing read its artifact and no baseline was compared. This one is the opposite case - it has
# committed baselines, a tolerance, and a non-zero exit on drift. If a run is red, the numbers in the
# README and docs/evaluation.md are wrong until someone explains why.
on:
  # The case the push trigger below cannot see. The repository pinned no SDK until commit 42ed550:
  # every setup-dotnet step asked for 10.0.x, which resolved to 10.0.111 on a developer machine and
  # 10.0.401 on the runner, and a pin could go red with no commit deserving it - the drift is then
  # found by the next commit under one of the paths below, which turns this run red and gets blamed
  # for it. global.json now pins the SDK, so the frequent half of that is closed.
  #
  # The schedule is not redundant with the pin, and the reason is narrow. A pin freezes the version
  # this repository chooses; it does not freeze the base image, the runtime patch or the RID, and
  # those still move underneath a commit that never touched a file. What a schedule adds is
  # detection for a drift nobody caused - one run a week, cheap enough to be worth it for that.
  #
  # It is also not what would have caught QueryTermWeighting. A push covers a regression; the
  # schedule covers the environment. Both were needed, and the incident needed the first.
  #
  # Monday 05:23 UTC. Off the top of the hour, because GitHub delays scheduled runs queued at :00
  # under load; off the working day, because each run downloads about 100 MB of corpora and two
  # overlapping runs spend the same runner-hours twice.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'bench/LexiSharp.Eval/**'
      - 'Directory.Build.props'
      # global.json is here for the same reason Directory.Build.props is: it decides what these
      # numbers are measured with. Bumping the SDK can move a score without touching a single file
      # under src/, and the commit that made that change would otherwise ship without a replay.
      - 'global.json'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  verify-reference:
    # No continue-on-error. This was never inside CI to be advisory, and a run dispatched on purpose
    # should be able to report a drift as a failure. The artifact is uploaded with `if: always()` so a
    # red run still hands over the values that drifted.
    name: Pinned reference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
      # No dotnet-version here on purpose: setup-dotnet installs the version it is
      # given *as well as* the one in global.json, so naming one leaves the float.

      - name: Record the host these numbers come from
        run: |
          {
            echo "cores: $(nproc)"
            grep -m1 'model name' /proc/cpuinfo || true
            dotnet --info
          } | tee reference-host.txt

      # The corpora are not in the repository. The harness downloads each one and checks its md5
      # before use, so there is no fetch step here and nothing to keep in sync.
      #
      # Redirected, then printed, and deliberately not `... 2>&1 | tee file`. GitHub's default shell
      # for run steps is `bash -e` without `pipefail`, so a pipeline reports the status of its last
      # command: a drift would exit non-zero from dotnet, tee would return zero, and the step would
      # go green. A gate that cannot fail is the exact thing this workflow exists to stop being.
      - name: Replay every pinned configuration
        run: |
          dotnet run --project bench/LexiSharp.Eval -c Release -- \
            --verify-reference bench/LexiSharp.Eval/reference/pinned.json \
            > reference-verify.txt 2>&1
          status=$?
          cat reference-verify.txt
          exit $status

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pinned-reference
          path: |
            reference-verify.txt
            reference-host.txt
          if-no-files-found: ignore
